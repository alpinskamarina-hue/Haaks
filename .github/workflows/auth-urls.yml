name: Auth URLs

# Sets the Site URL and redirect URLs of the production Supabase project
# from supabase/auth-urls.json, so login links in emails point at the site.
# Only touches those two settings. Needs the SUPABASE_ACCESS_TOKEN secret.
on:
  push:
    branches: [main]
    paths: ["supabase/auth-urls.json", ".github/workflows/auth-urls.yml"]
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lvcgmpgvtnayecwtkrfo
    steps:
      - name: Check secret
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set yet, skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Apply auth URLs
        if: steps.secrets.outputs.ready == 'true'
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @supabase/auth-urls.json)
          if [ "$status" != "200" ]; then
            echo "Supabase answered HTTP $status:"
            cat response.json
            exit 1
          fi
          jq '{site_url, uri_allow_list}' response.json
